    <noscript><style>#boot { display: none !important; }</style></noscript>

    <script>
      // The curtain is one-per-session, and that has to be known before the
      // bundle loads or it flashes on every navigation. The timeout is a safety
      // net: if the bundle never arrives, the page is not left behind a screen.
      (function () {
        try {
          if (sessionStorage.getItem('intro-seen') === '1') {
            document.documentElement.className += ' intro-seen';
          }
        } catch (e) {}
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (boot) boot.remove();
        }, 8000);
      })();
    </script>
